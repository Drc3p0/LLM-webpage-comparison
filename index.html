<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LLM Cat Site Comparison</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                background: #14141c;
                color: #e8e8f0;
                padding: 3rem 1.5rem;
                line-height: 1.6;
            }
            .wrap {
                max-width: 640px;
                margin: 0 auto;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
                color: #f0f0f8;
            }
            p.sub {
                color: #9a9ab0;
                margin-bottom: 2rem;
                font-size: 0.95rem;
            }
            ul {
                list-style: none;
                display: grid;
                gap: 0.75rem;
            }
            li a {
                display: block;
                padding: 1rem 1.25rem;
                background: #1f1f2e;
                border: 1px solid #34344a;
                border-radius: 8px;
                color: #e8e8f0;
                text-decoration: none;
                font-weight: 500;
                transition:
                    border-color 0.15s,
                    background 0.15s;
            }
            li a:hover,
            li a:focus {
                border-color: #6f6fff;
                background: #26263a;
            }
            li a::after {
                content: " →";
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>LLM Cat Site Comparison</h1>
            <p class="sub">
                Same prompt, different models. Pick one to view its result.
            </p>
            <ul>
                <li><a href="Claude/">Claude</a></li>
                <li><a href="ChatGPT/">ChatGPT</a></li>
                <li><a href="Antigravity/">Antigravity</a></li>
                <li><a href="Qwen/">Qwen</a></li>
                <li><a href="DeepSeek/">DeepSeek</a></li>
            </ul>
        </div>
    </body>
</html>
